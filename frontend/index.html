<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motostock</title>
  <script>
    // Conserva los enlaces guardados antes de separar las páginas.
    const [ruta, filtros] = location.hash.slice(1).split('?');
    const [pagina, id] = ruta.split('/');
    const paginas = ['catalogo', 'login', 'registro', 'producto', 'carrito', 'compra', 'pedidos', 'pedido'];
    const destino = new URL((paginas.includes(pagina) ? pagina : 'catalogo') + '.html', location.href);
    destino.search = filtros || location.search;
    if (id && (pagina === 'pedido' || pagina === 'producto')) destino.searchParams.set('id', id);
    location.replace(destino);
  </script>
</head>
<body><a href="catalogo.html">Abrir el catálogo de Motostock</a></body>
</html>
