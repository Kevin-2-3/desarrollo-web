<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1148bd">
  <title>Motostock · Producto</title>
  <link rel="stylesheet" href="/css/tienda.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body data-vista="producto">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header><div class="barra">
    <a href="catalogo.html" class="marca" aria-label="Motostock, ir al catálogo">MOTO<span>STOCK</span></a>
    <nav aria-label="Navegación principal">
      <a href="catalogo.html" data-nav="catalogo">Catálogo</a>
      <a href="pedidos.html" data-nav="pedidos" hidden>Mis pedidos</a>
      <a href="carrito.html" data-nav="carrito">Carrito</a>
      <a href="login.html" data-nav="login">Iniciar sesión</a>
      <button type="button" id="salir" hidden>Cerrar sesión</button>
    </nav>
  </div></header>
  <div id="aviso" role="status" aria-live="polite"></div>
  <main id="contenido" tabindex="-1">
    <a class="enlace" id="volver" href="catalogo.html">Volver al catálogo</a>
    <p id="estado-producto" role="status">Cargando producto…</p>
    <article class="producto-detalle" hidden>
      <div class="galeria">
        <img class="foto-detalle" alt="">
        <div class="miniaturas" hidden></div>
      </div>
      <div class="datos-producto">
        <p class="categoria"></p>
        <h1></h1>
        <p id="descripcion"></p>
        <form class="compra-variante">
          <label class="campo">Variante<select name="skuId" required></select></label>
          <p class="precio"></p>
          <p data-stock aria-live="polite"></p>
          <label class="campo">Cantidad<input type="number" name="cantidad" min="1" step="1" value="1" required></label>
          <button type="submit" class="boton" disabled>Agregar al carrito</button>
          <p role="status"></p>
        </form>
        <section id="especificaciones" hidden>
          <h2>Ficha técnica</h2>
          <dl class="ficha-tecnica"></dl>
        </section>
      </div>
    </article>
  </main>
  <noscript>Activa JavaScript para consultar los productos de Motostock.</noscript>
</body>
</html>
