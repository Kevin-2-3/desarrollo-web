<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1148bd">
  <title>Motostock · Catálogo</title>
  <link rel="stylesheet" href="/css/tienda.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body data-vista="catalogo">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header><div class="barra">
    <a href="catalogo.html" class="marca" aria-label="Motostock, ir al catálogo">MOTO<span>STOCK</span></a>
    <nav aria-label="Navegación principal">
      <a href="catalogo.html" data-nav="catalogo">Catálogo</a>
      <a href="pedidos.html" data-nav="pedidos" hidden>Mis pedidos</a>
      <a href="carrito.html" data-nav="carrito">Carrito</a>
      <a href="login.html" data-nav="login">Iniciar sesión</a>
      <button type="button" id="salir" hidden>Cerrar sesión</button>
    </nav>
  </div></header>
  <div id="aviso" role="status" aria-live="polite"></div>
  <main id="contenido" tabindex="-1">
    <section class="portada" aria-labelledby="titulo-tienda">
      <h1 id="titulo-tienda">Encuentra lo que necesitas para tu moto</h1>
    </section>
    <div class="catalogo-layout">
      <aside class="filtros panel">
        <h2>Filtros</h2>
        <form id="filtros-catalogo" action="catalogo.html" method="get">
          <fieldset>
            <legend>Categoría</legend>
            <label class="opcion-categoria"><input type="radio" name="categoria" value="" checked> Todas</label>
            <label class="opcion-categoria"><input type="radio" name="categoria" value="MOTO"> Motocicletas</label>
            <label class="opcion-categoria"><input type="radio" name="categoria" value="ACCESORIO"> Accesorios</label>
            <label class="opcion-categoria"><input type="radio" name="categoria" value="REFACCION"> Refacciones</label>
          </fieldset>
          <fieldset>
            <legend>Precio en MXN</legend>
            <div class="rango-precio">
              <label class="campo">Desde<input type="number" min="0" step="0.01" name="precioMin" placeholder="Mínimo"></label>
              <label class="campo">Hasta<input type="number" min="0" step="0.01" name="precioMax" placeholder="Máximo"></label>
            </div>
          </fieldset>
          <button class="boton" type="submit">Aplicar filtros</button>
          <a class="enlace" href="catalogo.html">Limpiar filtros</a>
        </form>
      </aside>
      <section class="resultados" aria-labelledby="titulo-catalogo">
        <h2 id="titulo-catalogo">Catálogo</h2>
        <div class="busqueda">
          <input type="search" form="filtros-catalogo" name="busqueda" aria-label="Buscar por nombre, marca o modelo" placeholder="Buscar por nombre, marca o modelo">
          <button class="boton" form="filtros-catalogo" type="submit">Buscar</button>
        </div>
        <div id="lista-productos" aria-busy="true">
          <p class="cabecera-resultados" role="status">Cargando productos…</p>
          <div class="productos-grid"></div>
          <a href="catalogo.html" id="restablecer" hidden>Ver todo el catálogo</a>
          <button type="button" class="boton secundario" id="reintentar" hidden>Reintentar</button>
          <nav class="paginacion" aria-label="Páginas de productos" hidden>
            <a class="boton secundario" id="anterior">Anterior</a>
            <span id="numero-pagina"></span>
            <a class="boton secundario" id="siguiente">Siguiente</a>
          </nav>
        </div>
        <template id="tarjeta">
          <article class="tarjeta-producto">
            <img class="foto-producto" alt="" loading="lazy">
            <div class="tarjeta-info">
              <span class="categoria"></span>
              <h3></h3>
              <p class="precio"></p>
              <span data-stock></span>
              <a class="boton secundario" data-detalle>Ver detalle</a>
            </div>
          </article>
        </template>
      </section>
    </div>
  </main>
  <noscript>Activa JavaScript para consultar los productos de Motostock.</noscript>
</body>
</html>
